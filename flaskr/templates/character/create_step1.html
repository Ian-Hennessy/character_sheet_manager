{% extends 'base.html' %}

{% block title %}Create Character - Step 1{% endblock %}

{% block header %}
  <h1>Create New Character</h1>
  <p>Step 1 of 3: Basic Information</p>
{% endblock %}

{% block content %}
<div class="create-character-container">
  <form method="POST" action="{{ url_for('character.create_step1') }}" class="character-form">
    <div class="form-section">
      <h2>Character Name</h2>
      
      <div class="form-group">
        <label for="name">Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          required 
          maxlength="100"
          placeholder="Enter your character's name"
          autocomplete="off"
        >
        <small>Choose a unique name for your character (max 100 characters)</small>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('character.home') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Next Step →</button>
    </div>
  </form>
</div>

<style>
  .create-character-container {
    max-width: 600px;
    margin: 2rem auto;
    padding: 2rem;
  }

  .character-form {
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    padding: 2rem;
  }

  .form-section {
    margin-bottom: 2rem;
  }

  .form-section h2 {
    margin-bottom: 1.5rem;
    color: #333;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: #333;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
    font-family: inherit;
    box-sizing: border-box;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  .form-group small {
    display: block;
    margin-top: 0.25rem;
    color: #666;
    font-size: 0.9rem;
  }

  .form-actions {
    display: flex;
    gap: 1rem;
    justify-content: flex-end;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid #e0e0e0;
  }

  .btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 4px;
    font-weight: 500;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-block;
  }

  .btn-primary {
    background: #667eea;
    color: white;
  }

  .btn-primary:hover {
    background: #5568d3;
  }

  .btn-secondary {
    background: #e0e0e0;
    color: #333;
  }

  .btn-secondary:hover {
    background: #d0d0d0;
  }
</style>
{% endblock %}
